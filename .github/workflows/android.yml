name: Android

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build APKs
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: rate-parade-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: rate-parade-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check version and prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main" >&2
            exit 1
          fi
          version="${TAG#v}"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          if [[ "$version" != "$app_version" ]]; then
            echo "Tag $TAG does not match app version $app_version" >&2
            exit 1
          fi
          awk -v heading="## $version" '
            $0 == heading || index($0, heading " ") == 1 { found = 1; next }
            /^## / && found { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "CHANGELOG.md needs a nonempty section for $version" >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install signing tools
        run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@v8
        with:
          name: rate-parade-release-unsigned
          path: unsigned
      - name: Sign and verify release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/rate-parade-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -c -p 4 unsigned/app-release-unsigned.apk
          "$tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out "rate-parade-${GITHUB_REF_NAME}.apk" \
            unsigned/app-release-unsigned.apk
          "$tools/apksigner" verify --verbose "rate-parade-${GITHUB_REF_NAME}.apk"
          sha256sum "rate-parade-${GITHUB_REF_NAME}.apk" > "rate-parade-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "rate-parade-${TAG}.apk" \
            "rate-parade-${TAG}.apk.sha256" \
            --verify-tag \
            --title "Rate Parade $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
